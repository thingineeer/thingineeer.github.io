    // 데스크탑/크롤러만 아래 폴백 랜딩을 본다.
    (function () {
      var IOS_URL = "https://apps.apple.com/kr/app/%EB%94%B8%EA%B9%8D-%ED%82%A4%EB%B3%B4%EB%93%9C-%EC%86%8C%EB%A6%AC-asmr/id6778519384";
      var ANDROID_URL = "https://play.google.com/store/apps/details?id=th1ngjin.ddalggak";
      var ua = navigator.userAgent || "";
      // iPadOS 13+ 는 Mac UA 로 위장하므로 터치 지원 여부로 판별
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      if (isIOS) { location.replace(IOS_URL); }
      else if (isAndroid) { location.replace(ANDROID_URL); }
    })();
  </script>
